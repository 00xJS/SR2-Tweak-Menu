[mod]
name = SR Tweak Menu (Saints Row 2)
author = 00xJS
version = 0.4.16
description = SR Tweak Menu for Saints Row 2 (PC, with or without Juiced Patch): player, weapon and vehicle cheats, spawning, teleports, play as anyone, emotes, the phone's cheats, a free camera and quality-of-life tweaks. Open with F5, or RB + D-pad Down. Private play only.

[settings]
; ---- Menu ----
; Key that opens and closes the menu ("" = none).
menu_key = F5
; Controller buttons that open and close the menu: hold the first ones, press the last ("" = none).
; Names: A B X Y, LB RB LT RT, LS RS (stick clicks), BACK START, UP DOWN LEFT RIGHT (D-pad).
; The menu captures buttons. Outside Customize and Emotes, the sticks still move and look.
menu_pad = RB+DOWN
; Holding Back (View) for menu_hold_seconds also opens and closes it. Off: with it on, a short tap of Back (the map) doesn't reach the game.
menu_hold_back = false
menu_hold_seconds = 0.8
; Rows shown per page.
menu_rows = 12
; Draw the menu on screen (the host draws it with the game's own text). Set false for no menu text.
menu_overlay = true
; Look: game (drawn with Saints Row 2's own menu art, fonts and sounds) or text (plain text). Settings > Menu UI switches it.
menu_style = game
; Game look: where the menu sits (1280 x 720 units from the top left), its size, and SR2's fonts for rows and headings.
menu_x = 36
menu_y = 36
menu_scale = 1.0
; SR2's interface canvas: auto (ask the game), sd (640 x 480) or hd (1280 x 720). Change it if the menu is twice or half its size.
menu_canvas = auto
; Fonts, as SR2 own menus use them: rows, the label on the yellow bar, and tabs / header / button tips.
menu_font_text = thin_overlay
menu_font_bar = thin
menu_font_heading = header_n_overlay
; How wide the menu is (400 to 640).
menu_width = 500

; ---- Where the menu text sits ----
; In 1280 x 720 units from the top left of the screen; line spacing; font: 6 small, 2 medium.
overlay_x = 60
overlay_y = 70
overlay_line = 20
overlay_font = 6

; ---- Start-up (also switched in the menu: Settings > Game & saving) ----
; No logo movies and no legal screens (the host applies it as the game starts).
skip_intro = false
; Load your newest save from the main menu, after load_last_save_wait seconds (any controller button stays on the menu).
load_last_save = false
load_last_save_wait = 3
; Lift the 100 mph cap the game puts on every vehicle's top speed as it loads them.
higher_max_speed = false
; Quick save: on/off at start, and its key (saves to the slot you last saved to, or the autosave).
quick_save = false
quick_save_key = F9

; ---- Quality of life: how each row starts (the menu switches them any time) ----
crouch_while_moving = true
sprint_while_on_fire = false
disarm_on_ragdoll = false
no_melee_lock_on = false
reload_in_cars = false
reload_while_sprinting = false
weapon_switch_any_time = false
; Driving camera: free camera in cars; how long it holds before following the car again (10.5 = always); swing-back speed.
car_free_camera = true
car_camera_reset_after = 3.0
car_camera_reset_after_stopped = 0.5
car_camera_swing_back = 1.0
car_camera_follows_nose = false
drive_by_free_camera = false
; How wide the driving camera gets at top speed (90 = no change).
speed_fov = 90
; Field of view multiplier and camera (mouse) turn speed multiplier.
field_of_view = 1.0
camera_turn_speed = 1.0
; First-person view on foot: on/off at start, its field of view (x1 = the game's own) and camera depth (-0.6 = your eyes).
first_person = false
first_person_fov = 1.2
first_person_depth = -0.6
map_arrow_follows_player = false
no_black_bars = false
no_climb_camera_lock = false
no_sprint_shake = false
no_screen_blur = false
no_vignette = false
cutscene_pause = false
no_tutorials = false

; Write every game script call to TweakMenu/wml.log.
debug = false
; Development: once a game is loaded, run every row without keys and log the results (selftest.lua).
selftest = false
; Development: run TweakMenu/probe_in.lua whenever it changes, output in TweakMenu/probe_out.txt (probe.lua).
dev_probe = false


